name: Playwright Cucumber Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly build - Every day at 2 AM UTC
    - cron: '0 2 * * *'
    # Weekly regression - Every Sunday at 6 AM UTC
    - cron: '0 6 * * 0'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        env:
          ENV: qa
          BROWSER: chromium
          HEADLESS: true
        run: npm test

      - name: Generate HTML report
        if: always()
        run: npm run report || echo "Report generation skipped"

      - name: Generate Allure results
        if: always()
        run: npm run allure:convert || echo "Allure conversion skipped"

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: videos/
          retention-days: 7

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-reports
          path: reports/
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

  # Publish Allure Report
  publish-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Java (required for Allure)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          tar -zxvf allure-2.32.0.tgz
          sudo mv allure-2.32.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

  # Send Email Report
  send-email:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Download HTML reports
        uses: actions/download-artifact@v4
        with:
          name: html-reports
          path: reports

      - name: Send Email Report
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: npm run email:report || echo "Email sending skipped (credentials not configured)"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let summary = '## 📊 Test Execution Summary\n\n';

            try {
              const reportPath = 'reports/json/cucumber-report.json';
              if (fs.existsSync(reportPath)) {
                const data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                let total = 0, passed = 0, failed = 0;

                data.forEach(feature => {
                  feature.elements.forEach(scenario => {
                    total++;
                    const hasFailed = scenario.steps.some(step => step.result.status === 'failed');
                    if (hasFailed) failed++;
                    else passed++;
                  });
                });

                const passRate = ((passed / total) * 100).toFixed(2);
                summary += `- **Total Scenarios:** ${total}\n`;
                summary += `- **✅ Passed:** ${passed}\n`;
                summary += `- **❌ Failed:** ${failed}\n`;
                summary += `- **Pass Rate:** ${passRate}%\n\n`;
                summary += failed > 0 ? '❌ **Status:** FAILED\n' : '✅ **Status:** PASSED\n';
              }
            } catch (error) {
              summary += '⚠️ Could not parse test results\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
